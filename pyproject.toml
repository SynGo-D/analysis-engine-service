[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-engine"
version = "1.0.0"
description = "Analysis Engine microservice for the CodePulse platform — consumes normalized PR/MR jobs from RabbitMQ, runs static-analysis tools through Reviewdog, and publishes analysis results."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "aio-pika>=9.5",
    # Static-analysis tools this service shells out to (subprocess, never
    # imported as a library). ESLint isn't a Python package — see
    # tools/eslint/.
    "pylint>=4.0",
    "radon>=6.0",
    # A manylinux wheel bundling the real compiled cppcheck binary, not a
    # Python reimplementation — verified end-to-end (see
    # analyzers/cppcheck_analyzer.py), not just installed and assumed to work.
    "cppcheck>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
