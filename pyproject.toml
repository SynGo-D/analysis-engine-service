[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-engine"
version = "1.0.0"
description = "Analysis Engine microservice for the CodePulse platform — a dedicated ESLint (JavaScript/TypeScript) analyzer that consumes normalized PR/MR jobs from RabbitMQ and publishes analysis results with quality metrics."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "aio-pika>=9.5",
    # ESLint itself isn't a Python package — it's this service's own
    # dedicated npm toolchain, see tools/eslint/.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
