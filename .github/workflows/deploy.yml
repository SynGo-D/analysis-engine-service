name: Deploy

# Only main, and only after CI has passed on it: a red build must never
# reach the running platform.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # So a deploy can be re-run without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to request the OIDC token AWS trusts

jobs:
  deploy:
    name: Build, push and roll out
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      # No access key anywhere: GitHub signs a short-lived token, AWS
      # trusts it for this repository on main only, and the credentials
      # expire when the job ends.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::814454905947:role/codepulse-github-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/codepulse/analysis-engine-service:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/codepulse/analysis-engine-service:current
                    cache-from: type=gha
          cache-to: type=gha,mode=max

      # The host pulls what was just pushed and restarts this one service.
      # Sent through SSM because the instance has no SSH port and no key.
      - name: Roll out on the application host
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-059cdefb4c573f592 \
            --document-name AWS-RunShellScript \
            --comment "deploy analysis-engine-service ${GITHUB_SHA::7}" \
            --parameters 'commands=["aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 814454905947.dkr.ecr.us-east-1.amazonaws.com && cd /opt/codepulse && docker compose --env-file .env pull analysis && docker compose --env-file .env up -d analysis && docker compose --env-file .env ps analysis"]' \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id i-059cdefb4c573f592 --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|TimedOut|Cancelled) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id i-059cdefb4c573f592 --query StandardOutputContent --output text

          # The job must fail when the rollout does, or a broken deploy
          # looks green.
          [ "$STATUS" = "Success" ]
